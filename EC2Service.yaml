AWSTemplateFormatVersion: "2010-09-09"
Description: Template to launch an Amazon EC2 instance.

Resources:
  SecurityGroupEx:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group With SSH port and Related EC2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SSH SecurityGroup
  
  EC2InstanceEX:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-01a00762f46d584a1
      KeyName: Linux-mumbai
      SecurityGroupIds:
        - !Ref SecurityGroupEx
      Tags:
        - Key: Name
          Value: GitHub-Linux-Server